<body>

  <script>
    // ОПТИМИЗАЦИЯ: отключаем console.log в продакшене для скорости
    const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!isDev) {
      console.log = () => {};
      console.debug = () => {};
    }
    
    const api = location.origin + '/api';
    const tg = window.Telegram?.WebApp;
    const q = new URLSearchParams(location.search);
    const uid = (q.get('uid') && Number(q.get('uid'))) || tg?.initDataUnsafe?.user?.id || 0;
    const headers = uid ? { 'X-Telegram-User-Id': String(uid), 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
const getHeaders = uid ? { 'X-Telegram-User-Id': String(uid) } : {};
    const uidQ = uid ? ('?uid=' + encodeURIComponent(String(uid))) : '';
    
    // ===== АНКОР ДЛЯ ВОЗВРАТА НА ГЛАВНУЮ =====
    // Отслеживание видимых ресторанов для восстановления позиции
    let restaurantObserver = null;
    let lastVisibleRestaurantId = null;
    
    function initRestaurantPositionTracking() {
      // Очищаем предыдущий observer если есть
      if (restaurantObserver) {
        restaurantObserver.disconnect();
      }
      
      // Создаем новый IntersectionObserver для отслеживания видимых ресторанов
      restaurantObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const restaurantId = entry.target.getAttribute('data-restaurant-id');
            if (restaurantId) {
              lastVisibleRestaurantId = restaurantId;
              try {
                sessionStorage.setItem('lastVisibleRestaurantId', restaurantId);
              } catch (e) {
                console.warn('Failed to save restaurant position:', e);
              }
            }
          }
        });
      }, {
        root: null,
        rootMargin: '0px',
        threshold: 0.3 // Элемент считается видимым, если видно 30% или больше
      });
      
      // Наблюдаем за всеми ресторанами
      document.querySelectorAll('[data-restaurant-id]').forEach(el => {
        restaurantObserver.observe(el);
      });
    }
    
    
    function saveCurrentPosition() {
      try {
        // Сохраняем текущую позицию скролла
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        sessionStorage.setItem('main_page_scroll', String(scrollY));
        
        // Сохраняем ID последнего видимого ресторана
        if (lastVisibleRestaurantId) {
          sessionStorage.setItem('lastVisibleRestaurantId', lastVisibleRestaurantId);
        }
      } catch (e) {
        console.warn('Failed to save position:', e);
      }
    }
    
    function setHomeAnchor(restaurantId) {
      try { 
        // Сохраняем якорь для точного восстановления
        sessionStorage.setItem('home_anchor', String(restaurantId));
        // Также сохраняем как последний видимый
        sessionStorage.setItem('lastVisibleRestaurantId', String(restaurantId));
        // Сохраняем позицию скролла
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        sessionStorage.setItem('main_page_scroll', String(scrollY));
      } catch(_) {}
    }
    
    function restoreHomeAnchor() {
      try {
        const anchor = sessionStorage.getItem('home_anchor');
        if (anchor) {
          // Если есть якорь из клика, используем его
          const el = document.querySelector('[data-restaurant-id="' + anchor + '"]');
          if (el) {
            setTimeout(() => {
              el.scrollIntoView({ block: 'center', behavior: 'auto' });
              // Удаляем якорь только после успешного восстановления
              sessionStorage.removeItem('home_anchor');
              // Показываем контент после восстановления
              const container = document.getElementById('mainContainer');
              if (container) {
                container.style.transition = 'opacity 0.2s ease-in';
                container.style.opacity = '1';
              }
              if (typeof hidePageLoadingOverlay === 'function') {
                hidePageLoadingOverlay();
              }
            }, 50);
            return;
          }
        }
        
        // Если нет якоря, пробуем восстановить по последнему видимому
        const savedRestaurantId = sessionStorage.getItem('lastVisibleRestaurantId');
        if (savedRestaurantId) {
          const el = document.querySelector(`[data-restaurant-id="${savedRestaurantId}"]`);
          if (el) {
            setTimeout(() => {
              el.scrollIntoView({ block: 'center', behavior: 'auto' });
              // Показываем контент после восстановления
              const container = document.getElementById('mainContainer');
              if (container) {
                container.style.transition = 'opacity 0.2s ease-in';
                container.style.opacity = '1';
              }
              if (typeof hidePageLoadingOverlay === 'function') {
                hidePageLoadingOverlay();
              }
            }, 50);
            return;
          }
        }
        
        // Если ничего не найдено, просто показываем контент
        const container = document.getElementById('mainContainer');
        if (container) {
          container.style.transition = 'opacity 0.2s ease-in';
          container.style.opacity = '1';
        }
        if (typeof hidePageLoadingOverlay === 'function') {
          hidePageLoadingOverlay();
        }
      } catch (e) {
        console.warn('Failed to restore position:', e);
        // В случае ошибки все равно показываем контент
        const container = document.getElementById('mainContainer');
        if (container) {
          container.style.transition = 'opacity 0.2s ease-in';
          container.style.opacity = '1';
        }
        if (typeof hidePageLoadingOverlay === 'function') {
          hidePageLoadingOverlay();
        }
      }
    }
    
    // Кэш для изображений
    const imageCache = new Map();
    
    // Функция для предзагрузки изображений с retry
    function preloadImage(src, retries = 3) {
      if (imageCache.has(src)) {
        return Promise.resolve(imageCache.get(src));
      }
      
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          imageCache.set(src, img);
          resolve(img);
        };
        img.onerror = () => {
          if (retries > 0) {
            console.log(`Retrying image load: ${src}, attempts left: ${retries}`);
            setTimeout(() => {
              preloadImage(src, retries - 1).then(resolve).catch(reject);
            }, 1000);
          } else {
            console.warn(`Failed to load image after all retries: ${src}`);
            reject(new Error(`Failed to load image: ${src}`));
          }
        };
        img.src = src;
      });
    }
    
    // Функция для безопасной загрузки изображения с lazy loading
    function safeImageLoad(imgElement, src) {
      if (!src) {
        imgElement.style.display = 'none';
        return;
      }
      
      // Добавляем lazy loading для производительности
      imgElement.loading = 'lazy';
      
      imgElement.onload = () => {
        imgElement.style.display = '';
      };
      
      imgElement.onerror = () => {
        console.warn(`Image failed to load: ${src}`);
        imgElement.style.display = 'none';
      };
      
      imgElement.src = src;
    }
    
    // Общая функция для создания карточек
    function createCard(it) {
      const card = document.createElement('div');
      card.className = 'mini-card';
      
      // Отображение для новых типов элементов подборок
      let cardImage = it.image;
      let cardTitle = it.title;
      let cardSubtitle = '';
      
      // ПРИОРИТЕТ У БЛЮДА: если есть dish, то это карточка блюда
      if (it.dish) {
        cardImage = it.image; // Только изображение подборки
        cardTitle = it.title || it.dish.name;
        cardSubtitle = `${it.dish.price} ₽`;
        card.className = 'mini-card dish-card';
        console.log('Applied dish-card class to:', cardTitle);
      } else if (it.restaurant) {
        cardImage = it.image; // Только изображение подборки
        cardTitle = it.title || it.restaurant.name;
        console.log('Restaurant data:', it.restaurant.name, 'rating:', it.restaurant.rating);
        cardSubtitle = `★ ${it.restaurant.rating ? it.restaurant.rating.toFixed(1) : '--'} · ${it.restaurant.delivery_time_minutes || '--'} мин`;
      }
      
      // Разная структура для карточек блюд и ресторанов
      if (it.dish) {
        card.innerHTML = `
          ${cardImage ? `<img alt="${cardTitle}"/>` : ''}
          <div class="cap">${cardTitle}</div>
          <div class="subtitle">
            <span class="price">${it.dish.price} ₽</span>
          </div>
          <div class="restaurant-info">
            <span class="restaurant-name">${it.restaurant ? it.restaurant.name : 'Неизвестный ресторан'}</span>
          </div>
        `;
        
        // Безопасная загрузка изображения
        if (cardImage) {
          const img = card.querySelector('img');
          safeImageLoad(img, cardImage);
        }
      } else {
        card.innerHTML = `
          ${cardImage ? `<img alt="${cardTitle}"/>` : ''}
          <div class="cap">${cardTitle}</div>
          ${cardSubtitle ? `<div class="subtitle">${cardSubtitle}</div>` : ''}
        `;
        
        // Безопасная загрузка изображения
        if (cardImage) {
          const img = card.querySelector('img');
          safeImageLoad(img, cardImage);
        }
      }
      
      return card;
    }
    
    async function loadSelections() {
      console.log('=== loadSelections started ===');
      try {
        // Показываем skeleton во время загрузки
        LoadingSystem.showSkeleton('selections', 'grid', 4);
        
        // Загружаем подборки из API
        const collectionsRes = await fetch(api + '/public/collections');
        console.log('Collections response:', collectionsRes.status, collectionsRes.ok);
        let data = [];
        
        if (collectionsRes.ok) {
          const collections = await collectionsRes.json();
          console.log('Collections data:', collections);
          if (collections && collections.length > 0) {
            // Отладочная информация о рейтингах
            collections.forEach(collection => {
              console.log(`Collection: ${collection.name}`);
              collection.items.forEach(item => {
                if (item.restaurant) {
                  console.log(`  Restaurant: ${item.restaurant.name} - Rating: ${item.restaurant.rating}`);
                }
              });
            });
            // Преобразуем подборки в формат для отображения
            data = collections.map(collection => ({
              id: collection.id,
              title: collection.name,
              description: collection.description,
              image: collection.image,
              kind: 'mixed', // Смешанный тип (рестораны и блюда)
              items: collection.items.map(item => ({
                id: item.id,
                title: item.title,
                subtitle: item.subtitle,
                image: item.image,
                type: item.type,
                item_id: item.item_id,
                restaurant: item.restaurant,
                dish: item.dish
              }))
            }));
          }
        }
        
        // Если подборок нет - просто скрываем секцию
        if (data.length === 0) {
          console.log('No collections found - hiding selections section');
          document.getElementById('selections').style.display = 'none';
          return;
        }
        
        console.log('Final data to render:', data);
        const root = document.getElementById('selections');
        root.innerHTML = '';
        data.forEach(block => {
          console.log('Rendering block:', block);
          const sec = document.createElement('div');
          sec.className = 'section';
          
          // Создаем простой заголовок
          sec.innerHTML = `<div class="title">${block.title}</div>`;
          
          const row = document.createElement('div');
          // Используем горизонтальный скролл вместо карусели
          const isCarousel = false;
          if (isCarousel) {
            row.className = 'carousel';
            const track = document.createElement('div');
            track.className = 'carousel-track';
            let currentIndex = 0;
            const items = block.items;
            
            if (items.length === 0) {
              // Если нет элементов, показываем сообщение
              row.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">Нет элементов в подборке</div>';
              return;
            }
            
            const goToSlide = (index) => {
              currentIndex = index;
              track.style.transform = `translateX(-${index * 100}%)`;
            };
            
            const nextSlide = () => {
              currentIndex = (currentIndex + 1) % items.length;
              goToSlide(currentIndex);
            };
            
            const prevSlide = () => {
              currentIndex = (currentIndex - 1 + items.length) % items.length;
              goToSlide(currentIndex);
            };
            
            const prev = document.createElement('button');
            prev.className = 'carousel-btn prev';
            prev.textContent = '‹';
            prev.onclick = prevSlide;
            
            const next = document.createElement('button');
            next.className = 'carousel-btn next';
            next.textContent = '›';
            next.onclick = nextSlide;
            
            row.appendChild(track);
            row.appendChild(prev);
            row.appendChild(next);
            
              items.forEach((it, idx) => {
                const card = createCard(it);
                card.onclick = () => {
                  const p = new URLSearchParams(location.search);
                  if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
                  // Удаляем параметры поиска
                  p.delete('from');
                  p.delete('search_query');
                  p.delete('id');

                  // Если это блюдо из подборки — открываем его как модалку в ресторане
                  const dishId = it.item_id || it.dish_id || (it.dish && it.dish.id);
                  const restId = (it.restaurant && it.restaurant.id) || it.restaurant_id || (it.dish && it.dish.restaurant_id);
                  if (dishId && restId) {
                    location.href = `/static/restaurant.html?id=${restId}&dish_id=${dishId}&${p.toString()}`;
                    return;
                  }

                  if (it.type === 'restaurant' && it.item_id) {
                    console.log('=== Block item clicked (restaurant) ===');
                    console.log('Restaurant ID:', it.item_id);
                    console.log('Current scroll position before click:', window.pageYOffset || document.documentElement.scrollTop);
                    setHomeAnchor(it.item_id);
                    goToRestaurant(it.item_id);
                  } else if (it.restaurant_id) {
                    console.log('=== Block item clicked (restaurant by restaurant_id) ===');
                    console.log('Restaurant ID:', it.restaurant_id);
                    console.log('Current scroll position before click:', window.pageYOffset || document.documentElement.scrollTop);
                    setHomeAnchor(it.restaurant_id);
                    goToRestaurant(it.restaurant_id);
                  }

                  console.log('Block item onclick handler bound for:', it.title || it.name || 'unknown');
                };
                track.appendChild(card);
              });
            // swipe support
            let startX = 0; let dx = 0; let dragging = false;
            row.addEventListener('touchstart', (e) => { 
              dragging = true; 
              startX = e.touches[0].clientX; 
              dx = 0; 
            }, {passive:true});
            
            row.addEventListener('touchmove', (e) => { 
              if (!dragging) return; 
              dx = e.touches[0].clientX - startX; 
              track.style.transform = `translateX(-${currentIndex * 100 + dx / row.clientWidth * 100}%)`; 
            }, {passive:true});
            
            row.addEventListener('touchend', () => { 
              dragging = false; 
              if (Math.abs(dx) > row.clientWidth * 0.2) { 
                if (dx < 0) {
                  nextSlide();
                } else {
                  prevSlide();
                }
              } else { 
                goToSlide(currentIndex);
              } 
            });
            
            // init - начинаем с первого элемента
            goToSlide(0);
          } else {
            row.className = 'hscroll';
            
            // Обрабатываем элементы
            console.log('Processing block:', block.title, 'items:', block.items);
            block.items.forEach((it, index) => {
              console.log(`Item ${index}:`, it);
              
              // ПРИОРИТЕТ У БЛЮДА: если есть dish, то это карточка блюда
              if (it.dish || it.type === 'dish') {
                // Используем функцию createCard для блюд
                const card = createCard(it);
                card.onclick = () => {
                  const p = new URLSearchParams(location.search);
                  if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
                  // Удаляем параметры поиска
                  p.delete('from');
                  p.delete('search_query');
                  p.delete('id');

                  // Переходим в ресторан и сразу открываем блюдо в модалке
                  const dishId = it.item_id || it.dish_id || (it.dish && it.dish.id);
                  const restId = (it.restaurant && it.restaurant.id) || it.restaurant_id || (it.dish && it.dish.restaurant_id);
                  if (dishId && restId) {
                    location.href = `/static/restaurant.html?id=${restId}&dish_id=${dishId}&${p.toString()}`;
                  }
                };
                row.appendChild(card);
                return; // Пропускаем остальную логику для блюд
              }
              
              // Для ресторанов создаем карточку ресторана
              const card = document.createElement('div');
              card.className = 'restaurant-card';
              
              // Получаем данные ресторана
              let restaurantData = null;
              console.log('Checking item conditions:', {
                hasRestaurant: !!it.restaurant,
                type: it.type,
                item_id: it.item_id,
                restaurant_id: it.restaurant_id
              });
              
              if ((it.type === 'restaurant' && it.item_id) || it.restaurant_id) {
                const restaurantId = it.item_id || it.restaurant_id;
                // Используем базовые данные из it.restaurant или it
                const baseData = it.restaurant || it;
                restaurantData = { 
                  id: restaurantId, 
                  name: baseData.name || it.title, 
                  image: baseData.image || it.image, 
                  rating: baseData.rating || null, 
                  delivery_time_minutes: baseData.delivery_time_minutes || null 
                };
              }
              
              if (restaurantData) {
                // Создаем карточку ресторана в стиле Яндекс Еда
                card.innerHTML = `
                  <div class="restaurant-image">
                    ${restaurantData.image ? `<img alt="${restaurantData.name}"/>` : ''}
                  </div>
                  <div class="restaurant-info">
                    <div class="restaurant-details">
                      <h4 class="restaurant-name">${restaurantData.name}</h4>
                      <div class="delivery-info">
                        <span class="delivery-icon">🚚</span>
                        <span class="delivery-time">${restaurantData.delivery_time_minutes || '--'} мин</span>
                      </div>
                    </div>
                    <div class="restaurant-rating">
                      <span class="rating-stars">★</span>
                      <span class="rating-value">${restaurantData.rating ? restaurantData.rating.toFixed(1) : '--'}</span>
                    </div>
                  </div>
                `;
                
                // Безопасная загрузка изображения
                if (restaurantData.image) {
                  const img = card.querySelector('img');
                  safeImageLoad(img, restaurantData.image);
                }
                
                card.onclick = () => {
                  console.log('=== Restaurant card clicked ===');
                  console.log('Restaurant ID:', restaurantData.id);
                  console.log('Current scroll position before click:', window.pageYOffset || document.documentElement.scrollTop);
                  setHomeAnchor(restaurantData.id);
                  goToRestaurant(restaurantData.id);
                };
                
                // Добавляем отладочную информацию о привязке обработчика
                console.log('Restaurant card onclick handler bound for ID:', restaurantData.id);
              }
              
              row.appendChild(card);
            });
          }
          sec.appendChild(row);
          root.appendChild(sec);
        });
      } catch (error) {
        console.error('Error loading selections:', error);
        LoadingSystem.showError('selections', 'Ошибка загрузки подборок', loadSelections);
      }
    }
    async function loadRestaurants() {
      console.log('=== loadRestaurants() called ===');
      try {
        // Показываем skeleton во время загрузки
        LoadingSystem.showSkeleton('restaurants', 'restaurant', 6);
        
        // console.log('Fetching restaurants from:', api + '/restaurants');
        const res = await fetch(api + '/restaurants', { headers: getHeaders });
        console.log('Restaurants API response:', res.status, res.ok);
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        
        const data = await res.json();
        console.log('Restaurants data:', data);
        
        if (data.length === 0) {
          LoadingSystem.showEmpty('restaurants', 'Рестораны пока не добавлены', '🍽️');
          return;
        }
        
        const root = document.getElementById('restaurants');
        root.innerHTML = '';
        // console.log('Rendering restaurants, count:', data.length);
        
        data.forEach(r => {
          const el = document.createElement('div');
          el.className = 'rest-card';
          el.setAttribute('data-restaurant-id', r.id);
          el.innerHTML = `
            <div class="thumb">${r.image ? `<img alt="${r.name}"/>` : ''}</div>
            <div class="desc">
              <div class="title">${r.name}</div>
              <div class="meta">≈ ${r.delivery_time_minutes || '--'} мин · ★ ${r.rating_agg ? r.rating_agg.toFixed(1) : '--'}</div>
            </div>`;
          
          // Безопасная загрузка изображения
          if (r.image) {
            const img = el.querySelector('img');
            safeImageLoad(img, r.image);
          }
          
          // ИСПРАВЛЕНО: используем goToRestaurant вместо openMenu
          el.onclick = () => {
            console.log('=== Restaurant card clicked ===');
            console.log('Restaurant ID:', r.id);
            console.log('Current scroll position before click:', window.pageYOffset || document.documentElement.scrollTop);
            // Сохраняем якорь только при клике по карточке ресторана
            setHomeAnchor(r.id);
            
            // Простая навигация без индикаторов загрузки
            
            goToRestaurant(r.id);
          };
          
          // Добавляем отладочную информацию о привязке обработчика
          console.log('Restaurant card onclick handler bound for ID:', r.id);
          
          root.appendChild(el);
        });
        
        console.log('=== loadRestaurants() completed successfully ===');
        
        // Инициализируем отслеживание позиции после загрузки ресторанов
        setTimeout(() => {
          initRestaurantPositionTracking();
        }, 100);
      } catch (error) {
        console.error('Error loading restaurants:', error);
        console.log('=== loadRestaurants() failed ===');
        LoadingSystem.showError('restaurants', 'Ошибка загрузки ресторанов', loadRestaurants);
      }
    }

    async function openMenu(restaurantId) {
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Удаляем параметры поиска
      p.delete('from');
      p.delete('search_query');
      p.delete('id');
      location.href = `/static/restaurant.html?id=${restaurantId}&${p.toString()}`;
    }

    // Функция для перехода в ресторан с сохранением позиции прокрутки
    function goToRestaurant(restaurantId) {
      // Показываем loading overlay
      if (typeof showPageLoadingOverlay === 'function') {
        showPageLoadingOverlay();
      }
      
      const currentScrollPosition = window.pageYOffset || document.documentElement.scrollTop;
      console.log('=== goToRestaurant called ===');
      console.log('Restaurant ID:', restaurantId);
      console.log('Current scroll position:', currentScrollPosition);
      console.log('Document scroll height:', document.documentElement.scrollHeight);
      console.log('Window height:', window.innerHeight);
      // Не сохраняем якорь здесь — чтобы клики из подборок/категорий не ставили якорь
      
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Параметры скролла больше не используем
      
      // Очищаем старые параметры id и добавляем новый
      p.delete('id');
      p.set('id', restaurantId.toString());
      
      // Удаляем параметры поиска, чтобы не передавать их в ресторан
      p.delete('from');
      p.delete('search_query');
      
      const finalUrl = `/static/restaurant.html?${p.toString()}`;
      console.log('Final URL:', finalUrl);
      console.log('URL params:', p.toString());
      
      location.href = finalUrl;
    }
    
    // Инициализация
    async function initialize() {
      console.log('=== initialize() called ===');
      // ОПТИМИЗАЦИЯ: запускаем запросы параллельно
      await Promise.all([
        loadSelections(),
        loadRestaurants()
      ]);
      console.log('=== initialize() completed ===');
      // Восстанавливаем позицию после рендера
      // Небольшая задержка для завершения рендеринга всех элементов
      setTimeout(() => {
        restoreHomeAnchor();
      }, 100);
    }
    
   // Проверка доступа (блокировка)
   async function checkAccess() {
     try {
       const res = await fetch(api + '/users/activate', { method: 'POST', headers, body: JSON.stringify({}) });
       if (res.status === 403) {
         document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#333">Ошибка доступа</div>';
         return false;
       }
       if (res.ok) {
         const data = await res.json();
         if (data.user && data.user.is_blocked) {
           document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#333">Доступ запрещен</div>';
           return false;
         }
       }
     } catch (e) {}
     return true;
   }

  // Регистрируем Service Worker для кэширования (работает только на HTTPS)
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/static/sw.js')
      .then(() => console.log('[SW] Registered'))
      .catch((err) => console.warn('[SW] Registration failed:', err));
  }

  // Загружаем контент сразу; восстановление скролла управляется спейсером/наблюдателями
  (async () => {
    if (await checkAccess()) {
      await initialize();
      
      // Логика восстановления позиции теперь в restoreHomeAnchor()
      // Удаляем старую логику с restore_scroll, так как она конфликтует

      // Когда всё основное содержимое и позиция готовы,
      // скрываем оверлей загрузки, чтобы не было «мигания» главной
      if (typeof hidePageLoadingOverlay === 'function') {
        hidePageLoadingOverlay();
      }
    }
  })();
    
    // Добавляем отладочную информацию при загрузке страницы
    console.log('=== Page loaded ===');
    console.log('Initial scroll position:', window.pageYOffset || document.documentElement.scrollTop);
    console.log('Document height:', document.documentElement.scrollHeight);
    console.log('Window height:', window.innerHeight);
    console.log('URL:', location.href);
    
    // Добавляем обработчик прокрутки для отладки
    let scrollTimeout;
    window.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        console.log('Scroll position changed to:', window.pageYOffset || document.documentElement.scrollTop);
      }, 100);
    });
    

    document.getElementById('navHome').onclick = (e) => { 
      e.preventDefault(); 
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      location.href = '/static/index.html?' + p.toString(); 
    };
    document.getElementById('navCart').onclick = (e) => { 
      e.preventDefault(); 
      // Сохраняем позицию перед уходом
      saveCurrentPosition();
      // Показываем loading overlay
      if (typeof showPageLoadingOverlay === 'function') {
        showPageLoadingOverlay();
      }
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      p.set('from', 'index'); // Указываем, что переход с главной страницы
      location.href = '/static/cart.html?' + p.toString(); 
    };
    document.getElementById('navProfile').onclick = (e) => { 
      e.preventDefault(); 
      // Сохраняем позицию перед уходом
      saveCurrentPosition();
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      location.href = '/static/profile.html?' + p.toString(); 
    };
    document.getElementById('navPromotions').onclick = (e) => { 
      e.preventDefault(); 
      // Сохраняем позицию перед уходом
      saveCurrentPosition();
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      location.href = '/static/promotions.html?' + p.toString(); 
    };

    // ===== ПОИСК =====
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const searchBackBtn = document.getElementById('searchBackBtn');
    const searchSuggestions = document.getElementById('searchSuggestions');
    const searchFilters = document.getElementById('searchFilters');
    const searchResults = document.getElementById('searchResults');
    const searchResultsCount = document.getElementById('searchResultsCount');
    const pageTitle = document.getElementById('pageTitle');
    const selectionsDiv = document.getElementById('selections');
    const restaurantsDiv = document.getElementById('restaurants');
    
    let searchTimeout;
    let currentFilter = 'all';
    let currentQuery = '';
    
    // Популярные запросы (можно расширить)
    const popularQueries = ['вкус', 'пицца', 'бургер', 'суши', 'роллы'];
    
    function showSearchMode() {
      searchBackBtn.style.display = 'flex';
      searchFilters.style.display = 'block';
      searchResults.style.display = 'block';
      pageTitle.style.display = 'none';
      selectionsDiv.style.display = 'none';
      restaurantsDiv.style.display = 'none';
      document.body.classList.add('search-mode');
    }
    
    function hideSearchMode() {
      searchBackBtn.style.display = 'none';
      searchFilters.style.display = 'none';
      searchResults.style.display = 'none';
      pageTitle.style.display = 'block';
      selectionsDiv.style.display = '';
      restaurantsDiv.style.display = '';
      searchInput.value = '';
      searchClearBtn.style.display = 'none';
      searchSuggestions.style.display = 'none';
      currentQuery = '';
      currentFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === 'all') btn.classList.add('active');
      });
      document.body.classList.remove('search-mode');
    }
    
    function renderSuggestions() {
      if (!currentQuery || currentQuery.length < 2) {
        searchSuggestions.innerHTML = '';
        searchSuggestions.style.display = 'none';
        return;
      }
      
      const filtered = popularQueries.filter(q => q.toLowerCase().includes(currentQuery.toLowerCase()));
      if (filtered.length === 0) {
        searchSuggestions.style.display = 'none';
        return;
      }
      
      searchSuggestions.innerHTML = filtered.map(q => 
        `<button class="suggestion-chip" onclick="setSearchQuery('${q}')">${q}</button>`
      ).join('');
      searchSuggestions.style.display = 'flex';
    }
    
    window.setSearchQuery = function(query) {
      searchInput.value = query;
      currentQuery = query;
      searchClearBtn.style.display = 'flex';
      searchSuggestions.style.display = 'none';
      performSearch();
    };
    
    async function performSearch() {
      if (!currentQuery || currentQuery.trim().length < 2) {
        searchResults.innerHTML = '';
        searchResultsCount.textContent = '';
        return;
      }
      
      showSearchMode();
      
      try {
        const params = new URLSearchParams({
          q: currentQuery
        });
        
        if (currentFilter === 'restaurants') {
          params.append('type', 'restaurants');
        } else if (currentFilter === 'dishes') {
          params.append('type', 'dishes');
        }
        
        if (currentFilter === 'promotions') {
          params.append('with_promotions', 'true');
        }
        
        const res = await fetch(api + '/public/search?' + params.toString());
        if (!res.ok) throw new Error('Search failed');
        
        const data = await res.json();
        
        if (data.total === 0) {
          searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #6b7280;">Ничего не найдено</div>';
          searchResultsCount.textContent = 'Найдено 0 результатов';
          return;
        }
        
        searchResultsCount.textContent = `Найдено ${data.total} результатов`;
        
        if (data.restaurants.length === 0) {
          searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #6b7280;">Ничего не найдено</div>';
          return;
        }
        
        searchResults.innerHTML = data.restaurants.map(restaurant => {
          const p = new URLSearchParams(location.search);
          if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
          
          let dishesHtml = '';
          if (restaurant.dishes && restaurant.dishes.length > 0) {
            dishesHtml = `
              <div class="search-dishes-scroll">
                ${restaurant.dishes.map(dish => `
                  <div class="search-dish-card" onclick="location.href='/static/restaurant.html?id=${restaurant.id}&dish_id=${dish.id}&${p.toString()}'">
                    ${dish.image ? `<img src="${dish.image}" alt="${dish.name}" class="search-dish-image" onerror="this.style.display='none'"/>` : '<div class="search-dish-image"></div>'}
                    <div class="search-dish-info">
                      <div class="search-dish-name">${dish.name}</div>
                      <div class="search-dish-price">${dish.price} ₽</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }
          
          const ratingText = restaurant.rating && restaurant.rating > 0 
            ? `★ ${restaurant.rating.toFixed(1)}`
            : 'Мало оценок';
          
          return `
            <div class="search-restaurant-block">
              <div class="search-restaurant-header" onclick="setHomeAnchor(${restaurant.id}); goToRestaurant(${restaurant.id});">
                ${restaurant.image ? `<img src="${restaurant.image}" alt="${restaurant.name}" class="search-restaurant-image" onerror="this.style.display='none'"/>` : '<div class="search-restaurant-image"></div>'}
                <div class="search-restaurant-info">
                  <div class="search-restaurant-name">${restaurant.name}</div>
                  <div class="search-restaurant-meta">
                    <span class="search-restaurant-rating">${ratingText}</span>
                    <span>·</span>
                    <span>${restaurant.delivery_time_minutes || '--'} мин</span>
                    ${restaurant.delivery_fee === 0 ? '<span style="color: #059669; font-weight: 600;">Бесплатная доставка</span>' : ''}
                  </div>
                </div>
              </div>
              ${dishesHtml}
            </div>
          `;
        }).join('');
        
      } catch (error) {
        console.error('Search error:', error);
        searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #dc2626;">Ошибка при поиске</div>';
      }
    }
    
    searchInput.addEventListener('input', (e) => {
      const newValue = e.target.value;
      currentQuery = newValue;
      
      // Закрываем модальное окно при вводе
      if (document.getElementById('searchModal').style.display !== 'none') {
        document.getElementById('searchModal').style.display = 'none';
      }
      
      if (currentQuery.length > 0) {
        searchClearBtn.style.display = 'flex';
      } else {
        searchClearBtn.style.display = 'none';
        // НЕ вызываем hideSearchMode() здесь, чтобы не сбрасывать ввод
      }
      
      renderSuggestions();
      
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        if (currentQuery.trim().length >= 2) {
          performSearch();
        } else if (currentQuery.trim().length === 0) {
          // Только если поле полностью пустое, скрываем результаты
          searchResults.innerHTML = '';
          searchResultsCount.textContent = '';
          searchFilters.style.display = 'none';
          searchBackBtn.style.display = 'none';
        }
      }, 300);
    });
    
    // Закрытие клавиатуры при нажатии Enter на мобильных устройствах
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13) {
        // Закрываем клавиатуру на мобильных устройствах
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          searchInput.blur();
        }
      }
    });
    
    searchInput.addEventListener('focus', () => {
      // При фокусе переходим на страницу поиска
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Сохраняем позицию скролла перед переходом в поиск
      try {
        const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
        if (currentScroll > 0) {
          sessionStorage.setItem('main_page_scroll', currentScroll.toString());
        }
      } catch (e) {
        console.log('Could not save scroll position');
      }
      location.href = '/static/search.html?' + p.toString();
    });
    
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentQuery = '';
      searchClearBtn.style.display = 'none';
      hideSearchMode();
      searchInput.focus();
    });
    
    searchBackBtn.addEventListener('click', () => {
      hideSearchMode();
    });
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        if (currentQuery.trim().length >= 2) {
          performSearch();
        }
      });
    });
    
  </script>
</body>
</html>
