<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Акции</title>
  <link rel="stylesheet" href="/static/styles.v23.css?v=87" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ АКЦИЙ ===== */
    
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    
    .header p {
      color: #64748b;
      font-size: 16px;
    }
    
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .back-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    .promotions-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 30px;
    }
    
    .promotion-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      cursor: pointer;
      padding: 16px;
      border: 1px solid #e2e8f0;
    }
    
    .promotion-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    /* Маленький превью справа вверху */
    .promotion-thumb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    
    .promotion-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    
    .promotion-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px 0;
      line-height: 1.25;
    }
    
    .promotion-description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .promotion-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    
    .promotion-restaurant {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: #1f2937;
      font-weight: 700;
    }

    .restaurant-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
    }
    
    .promotion-date {
      font-size: 12px;
      color: #94a3b8;
    }

    .promotion-cta {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 10px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    }

    .restaurant-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #e5e7eb;
      background: #fff;
    }

    .tint-1 { background: #fff7ed; }
    .tint-2 { background: #fdf4ff; }
    .tint-3 { background: #eff6ff; }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .empty-state h3 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1e293b;
    }
    
    .empty-state p {
      font-size: 16px;
      line-height: 1.5;
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Адаптивность */
    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }
      
      .header h1 {
        font-size: 28px;
      }
      
      .promotions-grid { gap: 12px; }
      
      .back-btn {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" class="back-btn" onclick="goBack(); return false;">
      ← Назад
    </a>
    
    <div class="header">
      <h1>🎯 Акции</h1>
      <p>Специальные предложения от наших ресторанов</p>
    </div>
    
    <div id="promotionsContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Загружаем акции...</p>
      </div>
    </div>
  </div>

  <script>
    // ===== ОСНОВНЫЕ ПЕРЕМЕННЫЕ =====
    const api = location.origin + '/api';
    const q = new URLSearchParams(location.search);
    const uid = Number(q.get('uid')) || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 0);
    const headers = uid ? { 'X-Telegram-User-Id': String(uid) } : {};
    
    // ===== ЗАГРУЗКА АКЦИЙ =====
    async function loadPromotions() {
      try {
        const response = await fetch(api + '/public/promotions', { headers });
        
        if (!response.ok) {
          throw new Error('Ошибка загрузки акций');
        }
        
        const promotions = await response.json();
        renderPromotions(promotions);
        
      } catch (error) {
        console.error('Ошибка загрузки акций:', error);
        showError('Не удалось загрузить акции');
      }
    }
    
    // ===== ОТОБРАЖЕНИЕ АКЦИЙ =====
    function renderPromotions(promotions) {
      const container = document.getElementById('promotionsContainer');
      
      if (!promotions || promotions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>🎯 Акций пока нет</h3>
            <p>Следите за обновлениями! Скоро здесь появятся специальные предложения от наших ресторанов.</p>
          </div>
        `;
        return;
      }
      
      const tints = ['tint-1','tint-2','tint-3'];
      const promotionsHTML = promotions.map((promotion, idx) => `
        <div class="promotion-card ${tints[idx % tints.length]}" onclick="openPromotion(${promotion.restaurant_id})">
          <div class="promotion-header-row">
            <div style="flex:1; min-width:0">
              <h3 class="promotion-title">${promotion.name}</h3>
              <p class="promotion-description">${promotion.description}</p>
            </div>
            ${promotion.image ? 
              `<img src="${promotion.image}" alt="${promotion.name}" class="promotion-thumb">` :
              `<div class="promotion-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:#94a3b8;">🎯</div>`
            }
          </div>
          <div class="promotion-meta">
            <span class="promotion-restaurant">
              ${promotion.restaurant_image ? `<img class="restaurant-logo-img" src="${promotion.restaurant_image}" alt="${promotion.restaurant_name||'Ресторан'}">` : `<span class="restaurant-logo">${(promotion.restaurant_name||'?').slice(0,1)}</span>`}
              ${promotion.restaurant_name || 'Ресторан'}
            </span>
            <button class="promotion-cta">В ресторан</button>
          </div>
        </div>
      `).join('');
      
      container.innerHTML = `
        <div class="promotions-grid">
          ${promotionsHTML}
        </div>
      `;
    }
    
    // ===== ФОРМАТИРОВАНИЕ ДАТЫ =====
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffTime = Math.abs(now - date);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays === 1) {
        return 'Вчера';
      } else if (diffDays < 7) {
        return `${diffDays} дн. назад`;
      } else {
        return date.toLocaleDateString('ru-RU', {
          day: 'numeric',
          month: 'short'
        });
      }
    }
    
    // ===== ОТКРЫТИЕ АКЦИИ =====
    function openPromotion(restaurantId) {
      if (!restaurantId) {
        alert('Ресторан для этой акции не найден.');
        return;
      }
      // Сохраняем источник перехода в sessionStorage для надежной работы на iOS
      try {
        sessionStorage.setItem('navigationSource', 'promotions');
      } catch (e) {
        console.log('Could not save navigation source to sessionStorage:', e);
      }
      
      const p = new URLSearchParams(location.search);
      if (!p.has('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      p.set('from', 'promotions'); // Указываем, что переход из акций (fallback для старых браузеров)
      location.href = `/static/restaurant.html?id=${restaurantId}&${p.toString()}`;
    }
    
    // ===== ПОКАЗ ОШИБКИ =====
    function showError(message) {
      const container = document.getElementById('promotionsContainer');
      container.innerHTML = `
        <div class="empty-state">
          <h3>😔 Ошибка</h3>
          <p>${message}</p>
          <button onclick="loadPromotions()" style="
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
          ">Попробовать снова</button>
        </div>
      `;
    }
    
    // ===== ФУНКЦИЯ ВОЗВРАТА НАЗАД =====
    function goBack() {
      const params = new URLSearchParams(location.search);
      const from = params.get('from');
      const restaurantId = params.get('restaurant_id');
      
      // Если пришли из ресторана, возвращаемся в ресторан
      if (from === 'restaurant' && restaurantId) {
        const p = new URLSearchParams(location.search);
        if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
        p.delete('from');
        p.delete('restaurant_id');
        p.set('id', restaurantId);
        location.href = '/static/restaurant.html?' + p.toString();
        return;
      }
      
      // Иначе возвращаемся на главную
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      p.delete('from');
      p.delete('restaurant_id');
      location.href = '/static/index.html?' + p.toString();
    }
    
    // ===== ИНИЦИАЛИЗАЦИЯ =====
    document.addEventListener('DOMContentLoaded', function() {
      loadPromotions();
    });
  </script>
</body>
</html>
