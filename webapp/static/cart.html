<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Корзина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/telegram-webapp-init.js"></script>
  <!-- simple-scroll-restore removed -->
  <script src="/static/page-cache.js"></script>
    <link rel="stylesheet" href="/static/styles.v23.css?v=86" />
  <script src="/static/page-transitions.js"></script>
  <script src="/static/loading-system.js"></script>
  <script src="/static/optimistic-updates.js"></script>
  <script src="/static/preload-system.js"></script>
  <script src="/static/micro-animations.js"></script>
  <script src="/static/toast-system.js"></script>
  <script src="/static/page-loading.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #333;
    }
    
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      position: relative;
      padding-bottom: 120px;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .back-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    
    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    
    .clear-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    
    /* Restaurant Tabs */
    .restaurant-tabs {
      display: flex;
      gap: 8px;
      padding: 16px;
      overflow-x: auto;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .restaurant-tab {
      flex-shrink: 0;
      padding: 12px 20px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #f3f4f6;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-width: 140px;
    }
    
    .restaurant-tab.active {
      border-color: #dc2626;
      background: #dc2626;
      color: white;
    }
    
    .restaurant-tab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
    
    .restaurant-tab-name {
      font-weight: 600;
      text-align: center;
    }
    
    .restaurant-tab-price {
      color: inherit;
    }
    
    .restaurant-tab-time {
      color: inherit;
    }
    
    /* Cart Items */
    .cart-items {
      padding: 16px;
    }
    
    .cart-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f3f4f6;
      align-items: flex-start;
      transition: background-color 0.2s ease;
    }
    
    .cart-item:hover {
      background-color: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      margin: 0 -16px;
    }
    
    .cart-item:last-child {
      border-bottom: none;
    }
    
    .cart-item-image {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .cart-item-content {
      flex: 1;
      min-width: 0;
    }
    
    .cart-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .cart-item-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      flex-grow: 1;
      margin-right: 10px;
    }
    
    .cart-item-description {
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    
    .cart-item-price {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    
    .cart-item-weight {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }
    
    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .qty-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    .qty-btn:hover {
      background: #f3f4f6;
    }
    
    .qty-btn.plus {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
    }
    
    .qty-btn.plus:hover {
      background: #b91c1c;
    }
    
    .qty-display {
      min-width: 30px;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
    }
    
    /* Open Menu Button */
    .open-menu-btn {
      margin: 16px;
      width: calc(100% - 32px);
      padding: 16px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      color: #666;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .open-menu-btn:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }
    
    /* Bottom Checkout Bar */
    .checkout-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 16px;
      z-index: 1000;
    }
    
    .checkout-content {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    
    
    .checkout-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .total-sum {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    
    .checkout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .checkout-btn:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }
    
    .checkout-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }
    
    .checkout-btn.min-order-warning {
      background: #f3f4f6;
      color: #666;
      border: 1px solid #d1d5db;
      cursor: not-allowed;
      transform: none;
    }
    
    .checkout-btn.min-order-warning:hover {
      background: #f3f4f6;
      transform: none;
    }
    
    /* Empty cart */
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    
    .empty-cart-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    .empty-cart-text {
      font-size: 16px;
      margin-bottom: 8px;
    }
    
    .empty-cart-subtext {
      font-size: 14px;
      opacity: 0.7;
    }

    /* Too many carts page */
    .too-many-carts {
      padding: 20px;
      text-align: center;
    }

    .too-many-header h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .too-many-header p {
      font-size: 14px;
      color: #666;
    }

    .carts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      background: #f3f4f6;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .cart-card-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-card-name {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }

    .cart-card-items {
      display: flex;
      gap: 5px;
    }

    .cart-item-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cart-card-delete {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    
    .too-many-footer {
      margin-top: 30px;
      padding: 20px;
    }
    
    .done-btn {
      width: 100%;
      padding: 16px;
      background: #6b7280;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .done-btn:hover {
      background: #4b5563;
    }

    
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="goBack()">×</button>
        <div class="header-title">Назад</div>
      </div>
      <button class="clear-btn" onclick="clearCart()">🗑️</button>
    </div>
    
    <!-- Restaurant Tabs -->
    <div class="restaurant-tabs" id="restaurantTabs"></div>
    
    <!-- Cart Items -->
    <div class="cart-items" id="cartItems"></div>
    
    <!-- Open Menu Button -->
        <button class="open-menu-btn" id="openMenuBtn" onclick="openMenu()">В ресторан</button>
    
    <!-- Bottom Checkout Bar -->
    <div class="checkout-bar" id="checkout-bar">
      <div class="checkout-content">
        <div class="checkout-right">
          <div class="total-sum" id="totalSum">Итого 0 ₽</div>
          <button class="checkout-btn" id="checkoutBtn" onclick="proceedToCheckout()" disabled>Далее</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const api = location.origin + '/api';
    const tg = window.Telegram?.WebApp;
    const q = new URLSearchParams(location.search);
    const uid = (q.get('uid') && Number(q.get('uid'))) || tg?.initDataUnsafe?.user?.id || 0;
    const headers = uid ? { 'X-Telegram-User-Id': String(uid) } : {};
    
    let cart = null;
    let dishesMap = new Map();
    let restaurantsMap = new Map();
    let optionsMap = new Map();
    
    const url = new URL(location.href);
    let activeRestaurantId = Number(url.searchParams.get('r')) || 0;
    let restIdsCached = [];
    const orderId = url.searchParams.get('order_id');

    async function load() {
      // Если передан order_id, загружаем данные заказа и заполняем корзину
      if (orderId) {
        await loadOrderToCart(orderId);
        return;
      }
      try {
        console.log('Loading cart...');
      const res = await fetch(api + '/cart' + (uid ? ('?uid=' + uid) : ''), { headers });
        console.log('Cart response status:', res.status);
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        
      cart = await res.json();
        console.log('Cart data:', cart);
        console.log('Cart items count:', cart.items?.length || 0);
        
        if (!cart.items || !cart.items.length) {
          console.log('Cart is empty, showing empty state');
          showEmptyCart();
        return;
      }
        
      const ids = [...new Set(cart.items.map(i => i.dish_id))];
        console.log('Dish IDs to fetch:', ids);
        
      const dishes = await (await fetch(api + '/dishes?ids=' + ids.join(',') + (uid ? ('&uid=' + uid) : ''), { headers })).json();
        console.log('Dishes loaded:', dishes.length);
      dishesMap = new Map(dishes.map(d => [d.id, d]));
        
      const optionIds = [...new Set(cart.items.flatMap(i => (i.chosen_options || [])))];
      if (optionIds.length) {
        const opts = await (await fetch(api + '/options/lookup?ids=' + optionIds.join(','))).json();
        optionsMap = new Map(opts.map(o => [o.id, o]));
      }
        
      const restIds = [...new Set(cart.items.map(i => dishesMap.get(i.dish_id)?.restaurant_id))].filter(Boolean);
        console.log('Restaurant IDs:', restIds);
        
        // Проверяем количество ресторанов
        if (restIds.length > 4) {
          showTooManyRestaurants(restIds);
          return;
        }
        
      const resR = await fetch(api + '/restaurants/_bulk?ids=' + encodeURIComponent(restIds.join(',')) + (uid ? ('&uid=' + uid) : ''), { headers });
      const rests = resR.ok ? await resR.json() : await (await fetch(api + '/restaurants/_by-ids?ids=' + encodeURIComponent(restIds.join(',')) + (uid ? ('&uid=' + uid) : ''), { headers })).json();
      restaurantsMap = new Map(rests.map(r => [r.id, r]));
        
      if (!activeRestaurantId) activeRestaurantId = restIds[0];
      restIdsCached = restIds;
        
        console.log('Rendering restaurant tabs and cart items...');
        renderRestaurantTabs();
        renderCartItems();
        
        
        // Принудительно показываем checkout-bar для нормальной корзины
        document.getElementById('checkout-bar').style.display = 'block';
        updateCheckoutBar();
        
      } catch (error) {
        console.error('Error loading cart:', error);
        console.log('Showing empty cart due to error');
        showEmptyCart();
      }
    }

    async function loadOrderToCart(orderId) {
      try {
        console.log('Loading order to cart, order ID:', orderId);
        
        // Загружаем данные заказа
        const orderRes = await fetch(api + '/orders/' + orderId, { headers });
        if (!orderRes.ok) {
          throw new Error(`Failed to load order: ${orderRes.status}`);
        }
        
        const order = await orderRes.json();
        console.log('Order loaded:', order);
        
        // Очищаем текущую корзину
        await fetch(api + '/cart/clear', { 
          method: 'POST', 
          headers: { ...headers, 'Content-Type': 'application/json' }
        });
        
        // Добавляем товары из заказа в корзину
        for (const item of order.items) {
          const addItemPayload = {
            dish_id: item.dish_id,
            qty: item.qty,
            chosen_options: item.chosen_options || []
          };
          
          await fetch(api + '/cart/add', {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify(addItemPayload)
          });
        }
        
        // Загружаем обновленную корзину
        await load();
        
      } catch (error) {
        console.error('Error loading order to cart:', error);
        showEmptyCart();
      }
    }

    function showEmptyCart() {
      // Восстанавливаем отображение элементов
      document.getElementById('restaurantTabs').style.display = 'flex';
      document.getElementById('openMenuBtn').style.display = 'block';
      document.getElementById('checkout-bar').style.display = 'block';
      
      document.getElementById('cartItems').innerHTML = `
        <div class="empty-cart">
          <div class="empty-cart-icon">🛒</div>
          <div class="empty-cart-text">Корзина пуста</div>
          <div class="empty-cart-subtext">Добавьте блюда из меню ресторана</div>
        </div>
      `;
      document.getElementById('restaurantTabs').innerHTML = '';
      updateCheckoutBar();
    }

    function redirectToRestaurants() {
      // Переходим к списку ресторанов при пустой корзине
      const params = new URLSearchParams(location.search);
      if (!params.get('ngrok-skip-browser-warning')) params.set('ngrok-skip-browser-warning', '1');
      location.href = '/static/index.html?' + params.toString();
    }
    
    function redirectToRestaurant(restaurantId) {
      // Переходим к странице конкретного ресторана
      const params = new URLSearchParams(location.search);
      if (!params.get('ngrok-skip-browser-warning')) params.set('ngrok-skip-browser-warning', '1');
      location.href = `/static/restaurant.html?id=${restaurantId}&${params.toString()}`;
    }

    function showTooManyRestaurants(restIds) {
      // Скрываем обычные элементы корзины
      document.getElementById('restaurantTabs').style.display = 'none';
      document.getElementById('openMenuBtn').style.display = 'none';
      document.getElementById('checkout-bar').style.display = 'none';
      
      // Показываем страницу "Слишком много корзин"
      document.getElementById('cartItems').innerHTML = `
        <div class="too-many-carts">
          <div class="too-many-header">
            <h2>Слишком много корзин</h2>
            <p>Удалите корзину, чтобы собрать новую в заведении</p>
          </div>
          <div class="carts-list" id="cartsList"></div>
          <div class="too-many-footer">
            <button class="done-btn" onclick="goBack()">Готово</button>
          </div>
        </div>
      `;
      
      // Загружаем и отображаем список корзин
      loadCartsList(restIds);
    }
    
    async function loadCartsList(restIds) {
      try {
        // Получаем данные ресторанов
        const resR = await fetch(api + '/restaurants/_bulk?ids=' + encodeURIComponent(restIds.join(',')) + (uid ? ('&uid=' + uid) : ''), { headers });
        const rests = resR.ok ? await resR.json() : await (await fetch(api + '/restaurants/_by-ids?ids=' + encodeURIComponent(restIds.join(',')) + (uid ? ('&uid=' + uid) : ''), { headers })).json();
        
        // Группируем товары по ресторанам
        const restaurantItems = {};
        restIds.forEach(restId => {
          restaurantItems[restId] = cart.items.filter(item => {
            const dish = dishesMap.get(item.dish_id);
            return dish && dish.restaurant_id === restId;
          });
        });
        
        // Отображаем список корзин
        const cartsList = document.getElementById('cartsList');
        cartsList.innerHTML = '';
        
        restIds.forEach(restId => {
          const restaurant = rests.find(r => r.id === restId);
          const items = restaurantItems[restId] || [];
          
          if (restaurant && items.length > 0) {
            const cartCard = document.createElement('div');
            cartCard.className = 'cart-card';
            
            // Получаем изображения первых товаров
            const itemImages = items.slice(0, 3).map(item => {
              const dish = dishesMap.get(item.dish_id);
              return dish?.image;
            }).filter(Boolean); // Убираем пустые изображения
            
            cartCard.innerHTML = `
              <div class="cart-card-content">
                <div class="cart-card-name">${restaurant.name}</div>
                <div class="cart-card-items">
                  ${itemImages.map(img => `<img src="${img}" alt="Товар" class="cart-item-thumb" />`).join('')}
                </div>
              </div>
              <button class="cart-card-delete" onclick="deleteRestaurantCart(${restId})">🗑️</button>
            `;
            
            cartsList.appendChild(cartCard);
          }
        });
      } catch (error) {
        console.error('Error loading carts list:', error);
      }
    }
    
    async function deleteRestaurantCart(restaurantId) {
      if (confirm('Удалить корзину этого ресторана?')) {
        try {
          const response = await fetch(api + '/cart/clear?restaurant_id=' + restaurantId + (uid ? ('&uid=' + uid) : ''), { method: 'POST', headers });
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          // Удаляем элементы этого ресторана из локального объекта cart
          cart.items = cart.items.filter(item => {
            const dish = dishesMap.get(item.dish_id);
            return dish && dish.restaurant_id !== restaurantId;
          });
          
          // Обновляем список ресторанов
          restIdsCached = restIdsCached.filter(id => id !== restaurantId);
          
          // Если корзина стала пустой, переходим к странице ресторана
          if (!cart.items || cart.items.length === 0) {
            redirectToRestaurant(restaurantId);
          } else {
            // Если удалили активный ресторан, переключаемся на первый доступный
            if (activeRestaurantId === restaurantId && restIdsCached.length > 0) {
              activeRestaurantId = restIdsCached[0];
            }
            
            // Обновляем интерфейс
            renderRestaurantTabs();
            renderCartItems();
            updateCheckoutBar();
          }
        } catch (error) {
          console.error('Error deleting restaurant cart:', error);
        }
      }
    }

    function renderRestaurantTabs() {
      const tabs = document.getElementById('restaurantTabs');
      tabs.innerHTML = '';
      
      console.log('Rendering restaurant tabs...');
      console.log('Restaurant IDs cached:', restIdsCached);
      console.log('Restaurants map:', restaurantsMap);
      
      restIdsCached.forEach(id => {
        const r = restaurantsMap.get(id);
        if (!r) {
          console.log('Restaurant not found for ID:', id);
          return;
        }
        
        console.log('Rendering tab for restaurant:', r);
        
        const total = calcTotalForRestaurant(id);
        const deliveryTime = r.delivery_time_minutes 
          ? `${r.delivery_time_minutes} мин`
          : '60 мин';
        
        const tab = document.createElement('button');
        tab.className = 'restaurant-tab' + (id === activeRestaurantId ? ' active' : '');
        tab.onclick = () => {
          activeRestaurantId = id;
          renderRestaurantTabs();
          renderCartItems();
          updateCheckoutBar();
        };
        
        tab.innerHTML = `
          <div class="restaurant-tab-name">${r.name}</div>
          <div class="restaurant-tab-info">
            <span class="restaurant-tab-price">${total} ₽</span>
            <span class="restaurant-tab-time">${deliveryTime}</span>
          </div>
        `;
        
        tabs.appendChild(tab);
      });
      
      // Принудительно показываем checkout-bar после рендеринга табов
      document.getElementById('checkout-bar').style.display = 'block';
    }

    function renderCartItems() {
      const root = document.getElementById('cartItems');
      root.innerHTML = '';
      
      console.log('Rendering cart items...');
      console.log('Cart:', cart);
      console.log('Active restaurant ID:', activeRestaurantId);
      console.log('Dishes map:', dishesMap);
      
      const items = cart.items.filter(it => {
        const d = dishesMap.get(it.dish_id);
        return d && d.restaurant_id === activeRestaurantId;
      });
      
      console.log('Filtered items for active restaurant:', items);
      
      if (items.length === 0) {
        root.innerHTML = '<div class="empty-cart"><div class="empty-cart-text">Нет товаров в корзине</div></div>';
        return;
      }
      
      // Группируем блюда по dish_id и chosen_options
      const groupedItems = new Map();
      
      items.forEach(it => {
        const d = dishesMap.get(it.dish_id);
        if (!d) {
          console.log('Dish not found for item:', it);
          return;
        }
        
        // Создаем ключ для группировки: dish_id + опции
        const optionsKey = (it.chosen_options || []).sort().join(',');
        const groupKey = `${it.dish_id}_${optionsKey}`;
        
        if (groupedItems.has(groupKey)) {
          // Если такое блюдо с такими же опциями уже есть, увеличиваем количество
          const existing = groupedItems.get(groupKey);
          existing.qty += it.qty;
          existing.itemIds.push(it.id); // Сохраняем ID всех элементов для управления
        } else {
          // Создаем новую группу
          groupedItems.set(groupKey, {
            dish_id: it.dish_id,
            chosen_options: it.chosen_options || [],
            qty: it.qty,
            itemIds: [it.id],
            dish: d
          });
        }
      });
      
      console.log('Grouped items:', groupedItems);
      
      // Отображаем сгруппированные блюда
      groupedItems.forEach(group => {
        const d = group.dish;
        const chosen = group.chosen_options.map(id => optionsMap.get(id)).filter(Boolean);
        const delta = chosen.reduce((s, o) => s + (o.price_delta || 0), 0);
        const unitPrice = (d.price || 0) + delta;
        const totalPrice = unitPrice * group.qty;
        
        const optsLabel = chosen.length ? chosen.map(o => o.name + (o.price_delta ? ` (+${o.price_delta} ₽)` : '')).join(', ') : '';
        const weight = d.weight ? `${d.weight} г` : '';
        
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.style.cursor = 'pointer';
        
        el.innerHTML = `
          ${d.image ? `<img src="${d.image}" alt="${d.name}" class="cart-item-image" />` : ''}
          <div class="cart-item-content">
            <div class="cart-item-header">
              <div class="cart-item-name">${d.name}</div>
              <div class="cart-item-controls">
                <button class="qty-btn" data-act="dec">−</button>
                <span class="qty-display">${group.qty}</span>
                <button class="qty-btn plus" data-act="inc">+</button>
            </div>
            </div>
            <div class="cart-item-description">${optsLabel}</div>
            <div class="cart-item-price">${totalPrice} ₽</div>
            <div class="cart-item-weight">${weight}</div>
          </div>
        `;
        
        // Добавляем обработчик клика для открытия деталей блюда
        el.onclick = (e) => {
          // Предотвращаем всплытие события при клике на кнопки управления количеством
          if (e.target.closest('.cart-item-controls')) {
            return;
          }
          
          // Переходим на страницу блюда
          const p = new URLSearchParams(location.search);
          if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
          p.set('from', 'cart'); // Указываем, что переход из корзины
          p.set('r', activeRestaurantId); // Сохраняем активный ресторан
          location.href = '/static/dish.html?id=' + d.id + '&' + p.toString();
        };
        
        // Обработчики для изменения количества
        el.querySelector('[data-act="inc"]').onclick = (e) => {
          e.stopPropagation(); // Предотвращаем всплытие события
          // Увеличиваем количество первого элемента в группе
          updateQty(group.itemIds[0], group.qty + 1);
        };
        
        el.querySelector('[data-act="dec"]').onclick = (e) => {
          e.stopPropagation(); // Предотвращаем всплытие события
          if (group.qty <= 1) {
            // Если количество 1 или меньше, удаляем все элементы группы
            group.itemIds.forEach(itemId => deleteItem(itemId));
          } else {
            // Иначе уменьшаем количество первого элемента в группе
            updateQty(group.itemIds[0], group.qty - 1);
          }
        };
        
        root.appendChild(el);
      });
      
      // Принудительно показываем checkout-bar после рендеринга товаров
      document.getElementById('checkout-bar').style.display = 'block';
    }

    function calcTotalForRestaurant(restaurantId) {
      return cart.items.reduce((sum, it) => {
        const d = dishesMap.get(it.dish_id);
        if (!d || d.restaurant_id !== restaurantId) return sum;
        const chosen = (it.chosen_options || []).map(id => optionsMap.get(id)).filter(Boolean);
        const delta = chosen.reduce((s, o) => s + (o.price_delta || 0), 0);
        return sum + (d.price + delta) * it.qty;
      }, 0);
    }

    function updateCheckoutBar() {
      const total = calcTotalForRestaurant(activeRestaurantId);
      const restaurant = restaurantsMap.get(activeRestaurantId);
      const minOrderAmount = restaurant?.delivery_min_sum || 0;
      
      document.getElementById('totalSum').textContent = `Итого ${total} ₽`;
      
      const checkoutBtn = document.getElementById('checkoutBtn');
      
      if (total <= 0) {
        checkoutBtn.disabled = true;
        checkoutBtn.textContent = 'Далее';
        checkoutBtn.className = 'checkout-btn';
      } else if (minOrderAmount > 0 && total < minOrderAmount) {
        // Не хватает минимальной суммы
        const remaining = minOrderAmount - total;
        checkoutBtn.disabled = true;
        checkoutBtn.textContent = `Добавьте еще на ${remaining} ₽`;
        checkoutBtn.className = 'checkout-btn min-order-warning';
      } else {
        // Минимальная сумма достигнута
        checkoutBtn.disabled = false;
        checkoutBtn.textContent = 'Далее';
        checkoutBtn.className = 'checkout-btn';
      }
      
    }

    async function updateQty(itemId, qty) {
      try {
        const response = await fetch(api + '/cart/items/' + itemId + '?qty=' + qty + (uid ? ('&uid=' + uid) : ''), { method: 'PATCH', headers });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        // Обновляем локальный объект cart
        const item = cart.items.find(i => i.id === itemId);
        if (item) {
          item.qty = qty;
        }
        
        // Обновляем интерфейс
        renderRestaurantTabs();
        renderCartItems();
        updateCheckoutBar();
      } catch (error) {
        console.error('Error updating quantity:', error);
      }
    }


    function openMenu() {
      // Показываем loading overlay
      if (typeof showPageLoadingOverlay === 'function') {
        showPageLoadingOverlay();
      }
      
      // Если корзина пустая или нет активного ресторана, идем на главную
      if (!activeRestaurantId || activeRestaurantId === 0) {
        location.href = '/static/index.html';
        return;
      }
      
      // Получаем сохраненную позицию скролла из sessionStorage или URL параметра
      let scrollPosition = 0;
      try {
        const savedPosition = sessionStorage.getItem('restaurant_scroll_position');
        if (savedPosition) {
          scrollPosition = Number(savedPosition);
          // Очищаем после чтения
          sessionStorage.removeItem('restaurant_scroll_position');
        }
      } catch (err) {
        console.log('Could not read scroll position from sessionStorage:', err);
      }
      
      // Fallback на URL параметр
      if (scrollPosition === 0) {
        const params = new URLSearchParams(location.search);
        scrollPosition = Number(params.get('scroll_position')) || 0;
      }
      
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Передаем позицию скролла и указываем, что пришли из корзины
      if (scrollPosition > 0) {
        p.set('scroll_position', scrollPosition.toString());
      }
      p.set('from', 'cart');
      location.href = '/static/restaurant.html?id=' + activeRestaurantId + '&' + p.toString();
    }

    function proceedToCheckout() {
      const total = calcTotalForRestaurant(activeRestaurantId);
      const restaurant = restaurantsMap.get(activeRestaurantId);
      const minOrderAmount = restaurant?.delivery_min_sum || 0;
      
      if (minOrderAmount > 0 && total < minOrderAmount) {
        alert(`Минимальная сумма заказа: ${minOrderAmount} ₽. Добавьте еще товаров на ${minOrderAmount - total} ₽`);
        return;
      }
      
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      p.set('r', String(activeRestaurantId));
      location.href = '/static/checkout.html?' + p.toString();
    }

    function goBack() {
      // Показываем loading overlay
      if (typeof showPageLoadingOverlay === 'function') {
        showPageLoadingOverlay();
      }
      
      // Получаем предыдущую страницу из referrer
      const referrer = document.referrer;
      
      // Если предыдущая страница - оформление заказа, возвращаемся на главную
      if (referrer && referrer.includes('/static/checkout.html')) {
        const p = new URLSearchParams(location.search);
        if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
        location.href = '/static/index.html?' + p.toString();
        return;
      }
      
      // Иначе возвращаемся на предыдущую страницу
      if (referrer && referrer.includes(location.origin)) {
        // Если referrer с того же домена, используем его
        location.href = referrer;
      } else if (history.length > 1) {
        // Если есть история, используем history.back()
        history.back();
      } else {
        // Иначе переходим на главную
        const p = new URLSearchParams(location.search);
        if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
        location.href = '/static/index.html?' + p.toString();
      }
    }

    async function deleteItem(itemId) {
      try {
        // Сохраняем ID ресторана перед удалением
        const itemToDelete = cart.items.find(item => item.id === itemId);
        const dishToDelete = itemToDelete ? dishesMap.get(itemToDelete.dish_id) : null;
        const restaurantIdToDelete = dishToDelete ? dishToDelete.restaurant_id : null;
        
        // Удаляем блюдо через API
        const response = await fetch(api + '/cart/items/' + itemId + (uid ? ('?uid=' + uid) : ''), { 
          method: 'DELETE', 
          headers 
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        // Удаляем элемент из локального объекта cart
        cart.items = cart.items.filter(item => item.id !== itemId);
        
        // Обновляем список ресторанов (удаляем рестораны без товаров)
        const remainingRestIds = new Set();
        cart.items.forEach(item => {
          const dish = dishesMap.get(item.dish_id);
          if (dish) {
            remainingRestIds.add(dish.restaurant_id);
          }
        });
        restIdsCached = Array.from(remainingRestIds);
        
        // Если корзина стала пустой, переходим к странице ресторана
        if (!cart.items || cart.items.length === 0) {
          if (restaurantIdToDelete) {
            redirectToRestaurant(restaurantIdToDelete);
          } else {
            redirectToRestaurants();
          }
        } else {
          // Если удалили все товары активного ресторана, переключаемся на первый доступный
          if (!restIdsCached.includes(activeRestaurantId) && restIdsCached.length > 0) {
            activeRestaurantId = restIdsCached[0];
          }
          
          // Обновляем интерфейс
          renderRestaurantTabs();
          renderCartItems();
          updateCheckoutBar();
        }
      } catch (error) {
        console.error('Error deleting item:', error);
        alert('Ошибка при удалении блюда');
      }
    }

    async function clearCart() {
      if (!activeRestaurantId) {
        alert('Выберите ресторан для очистки корзины');
        return;
      }
      
      const restaurant = restaurantsMap.get(activeRestaurantId);
      const restaurantName = restaurant ? restaurant.name : 'этого ресторана';
      
      if (confirm(`Очистить корзину ${restaurantName}?`)) {
        try {
          // Очищаем корзину только выбранного ресторана через API
          const response = await fetch(api + '/cart/clear?restaurant_id=' + activeRestaurantId + (uid ? ('&uid=' + uid) : ''), { 
            method: 'POST', 
            headers 
          });
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          // Удаляем элементы этого ресторана из локального объекта cart
          cart.items = cart.items.filter(item => {
            const dish = dishesMap.get(item.dish_id);
            return dish && dish.restaurant_id !== activeRestaurantId;
          });
          
          // Обновляем список ресторанов
          restIdsCached = restIdsCached.filter(id => id !== activeRestaurantId);
          
          // Если корзина стала пустой, переходим к странице ресторана
          if (!cart.items || cart.items.length === 0) {
            redirectToRestaurant(activeRestaurantId);
          } else {
            // Если удалили активный ресторан, переключаемся на первый доступный
            if (restIdsCached.length > 0) {
              activeRestaurantId = restIdsCached[0];
            }
            
            // Обновляем интерфейс
            renderRestaurantTabs();
            renderCartItems();
            updateCheckoutBar();
          }
        } catch (error) {
          console.error('Error clearing restaurant cart:', error);
          alert('Ошибка при очистке корзины ресторана');
        }
      }
    }
    
    function switchToNextRestaurant() {
      // Получаем список ресторанов, которые остались в корзине
      const remainingRestIds = [...new Set(cart.items.map(i => {
        const dish = dishesMap.get(i.dish_id);
        return dish ? dish.restaurant_id : null;
      }))].filter(Boolean);
      
      if (remainingRestIds.length === 0) {
        redirectToRestaurants();
        return;
      }
      
      // Находим текущий индекс в списке оставшихся ресторанов
      const currentIndex = remainingRestIds.indexOf(activeRestaurantId);
      
      let nextRestaurantId;
      if (currentIndex === -1) {
        // Если текущий ресторан не найден, берем первый доступный
        nextRestaurantId = remainingRestIds[0];
      } else {
        // Переключаемся на правый ресторан, если есть, иначе на левый
        if (currentIndex < remainingRestIds.length - 1) {
          nextRestaurantId = remainingRestIds[currentIndex + 1];
        } else if (currentIndex > 0) {
          nextRestaurantId = remainingRestIds[currentIndex - 1];
        } else {
          // Остался только один ресторан
          nextRestaurantId = remainingRestIds[0];
        }
      }
      
      // Переключаемся на новый ресторан
      activeRestaurantId = nextRestaurantId;
      
      // Обновляем URL
      const url = new URL(location.href);
      url.searchParams.set('r', String(activeRestaurantId));
      history.replaceState({}, '', url.toString());
      
      // Обновляем интерфейс
      renderRestaurantTabs();
      renderCartItems();
      updateCheckoutBar();
    }
    
    

    // Загружаем корзину при старте
    load();
    
    
  </script>
  
</body>
