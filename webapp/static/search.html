<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Поиск</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/styles.v23.css?v=88" />
  <script src="/static/preload-system.js" defer></script>
  <script src="/static/page-cache.js" defer></script>
  <script src="/static/page-transitions.js" defer></script>
  <script src="/static/loading-system.js" defer></script>
  <script src="/static/micro-animations.js" defer></script>
  <script src="/static/toast-system.js" defer></script>
  <script src="/static/keyboard-handler.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- Поисковая строка -->
    <div class="search-page-header" style="position: sticky; top: 0; z-index: 1000; background: white; padding-bottom: 8px;">
      <button class="search-back-btn" id="searchBackBtn">
        <span>←</span>
      </button>
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Быстрый поиск" />
        <button class="search-clear-btn" id="searchClearBtn" style="display: none;">✕</button>
      </div>
    </div>
    
    <!-- Предложения поиска -->
    <div id="searchSuggestions" class="search-suggestions"></div>
    
    <!-- Фильтры и результаты -->
    <div id="searchFilters" class="search-filters">
      <span class="search-results-count" id="searchResultsCount"></span>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="restaurants">Рестораны</button>
        <button class="filter-btn" data-filter="dishes">Блюда</button>
        <button class="filter-btn" data-filter="promotions">С акцией</button>
      </div>
    </div>
    
    <!-- Популярные рестораны (когда поле пустое) -->
    <div id="popularRestaurants" class="popular-restaurants-section">
      <h3 class="popular-section-title">Часто ищут</h3>
      <div id="popularRestaurantsList" class="popular-restaurants-list">
        <!-- Здесь будут популярные рестораны -->
      </div>
    </div>
    
    <!-- Результаты поиска (когда есть запрос) -->
    <div id="searchResults" class="search-results" style="display: none;"></div>
    
    <div class="nav-container">
      <a id="navHome" href="#" class="nav-item">
        <span class="nav-icon nav-icon-home"></span>
        <span>Главное</span>
      </a>
      <a id="navPromotions" href="/static/promotions.html" class="nav-item">
        <span class="nav-icon nav-icon-promo"></span>
        <span>Акции</span>
      </a>
      <a id="navCart" href="#" class="nav-item">
        <span class="nav-icon nav-icon-cart"></span>
        <span>Корзина</span>
      </a>
      <a id="navProfile" href="#" class="nav-item">
        <span class="nav-icon nav-icon-profile"></span>
        <span>Профиль</span>
      </a>
    </div>
  </div>

  <script>
    // Отключаем автоматическое восстановление скролла браузером (важно для iOS)
    // Должно быть в самом начале, до любых других операций
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    
    const api = location.origin + '/api';
    const tg = window.Telegram?.WebApp;
    const q = new URLSearchParams(location.search);
    const uid = (q.get('uid') && Number(q.get('uid'))) || tg?.initDataUnsafe?.user?.id || 0;
    const headers = uid ? { 'X-Telegram-User-Id': String(uid), 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
    const getHeaders = uid ? { 'X-Telegram-User-Id': String(uid) } : {};
    
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const searchBackBtn = document.getElementById('searchBackBtn');
    const searchSuggestions = document.getElementById('searchSuggestions');
    const searchFilters = document.getElementById('searchFilters');
    const searchResults = document.getElementById('searchResults');
    const searchResultsCount = document.getElementById('searchResultsCount');
    const popularRestaurants = document.getElementById('popularRestaurants');
    const popularRestaurantsList = document.getElementById('popularRestaurantsList');
    
    let searchTimeout;
    let currentFilter = 'all';
    let currentQuery = '';
    
    // Переменные для отслеживания восстановления позиции (защита от iOS)
    let isRestoringScroll = false;
    let targetScrollPosition = 0;
    let scrollRestoreTimeout = null;
    let scrollProtectionInterval = null;
    let scrollProtectionEndTime = 0;
    
    // Популярные запросы
    const popularQueries = ['вкус', 'пицца', 'бургер', 'суши', 'роллы'];
    
    // Функция для перехода в ресторан
    function goToRestaurant(restaurantId) {
      // Сохраняем позицию скролла перед переходом
      try {
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        sessionStorage.setItem('search_page_scroll', scrollY.toString());
        console.log('Saved search scroll position:', scrollY);
      } catch (e) {
        console.log('Could not save scroll position:', e);
      }
      
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      p.delete('id');
      p.set('id', restaurantId.toString());
      p.set('from', 'search');
      p.set('search_query', currentQuery);
      // Сохраняем ID ресторана для возврата к позиции
      p.set('scroll_to_restaurant_id', restaurantId.toString());
      location.href = `/static/restaurant.html?${p.toString()}`;
    }
    
    // Загружаем популярные рестораны при загрузке страницы
    async function loadPopularRestaurants() {
      try {
        // Сначала проверяем кэш PreloadSystem
        let restaurants = null;
        if (window.PreloadSystem && window.PreloadSystem.cache && window.PreloadSystem.cache.has('restaurants_data')) {
          restaurants = window.PreloadSystem.cache.get('restaurants_data');
          console.log('Using preloaded restaurants data from cache');
        }
        
        // Если нет в кэше, проверяем sessionStorage
        if (!restaurants) {
          try {
            const cached = sessionStorage.getItem('restaurants_data');
            if (cached) {
              restaurants = JSON.parse(cached);
              console.log('Using restaurants data from sessionStorage');
            }
          } catch (e) {
            console.log('No cached data in sessionStorage');
          }
        }
        
        // Если всё ещё нет, загружаем с сервера
        if (!restaurants) {
          const res = await fetch(api + '/restaurants', { headers: getHeaders });
          if (!res.ok) throw new Error('Failed to load restaurants');
          restaurants = await res.json();
          
          // Кэшируем в sessionStorage для следующих разов
          try {
            sessionStorage.setItem('restaurants_data', JSON.stringify(restaurants));
          } catch (e) {
            console.log('Could not cache to sessionStorage');
          }
        }
        
        const sorted = restaurants
          .filter(r => r.is_enabled)
          .sort((a, b) => {
            const ratingA = a.rating_agg || 0;
            const ratingB = b.rating_agg || 0;
            return ratingB - ratingA;
          })
          .slice(0, 10);
        
        if (sorted.length === 0) {
          popularRestaurantsList.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #6b7280;">Нет популярных ресторанов</div>';
          return;
        }
        
        const p = new URLSearchParams(location.search);
        if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
        
        popularRestaurantsList.innerHTML = sorted.map(r => {
          const ratingText = r.rating_agg && r.rating_agg > 0 
            ? `★ ${r.rating_agg.toFixed(1)}`
            : 'Мало оценок';
          
          const promoLabel = r.delivery_fee === 0 ? '<span class="promo-label green">Бесплатная доставка</span>' : '';
          
          return `
            <div class="popular-restaurant-item" onclick="goToRestaurant(${r.id})">
              ${r.image ? `<img src="${r.image}" alt="${r.name}" class="popular-restaurant-image" onerror="this.style.display='none'"/>` : '<div class="popular-restaurant-image"></div>'}
              <div class="popular-restaurant-info">
                <div class="popular-restaurant-name">${r.name}</div>
                <div class="popular-restaurant-meta">
                  <span class="popular-restaurant-rating">${ratingText}</span>
                  <span>·</span>
                  <span>${r.delivery_time_minutes || '--'} мин</span>
                </div>
                ${promoLabel ? `<div class="popular-restaurant-promos">${promoLabel}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
        
      } catch (error) {
        console.error('Error loading popular restaurants:', error);
        popularRestaurantsList.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #dc2626;">Ошибка загрузки</div>';
      }
    }
    
    function renderSuggestions() {
      if (!currentQuery || currentQuery.length < 2) {
        searchSuggestions.innerHTML = '';
        searchSuggestions.style.display = 'none';
        return;
      }
      
      const filtered = popularQueries.filter(q => q.toLowerCase().includes(currentQuery.toLowerCase()));
      if (filtered.length === 0) {
        searchSuggestions.style.display = 'none';
        return;
      }
      
      searchSuggestions.innerHTML = filtered.map(q => 
        `<button class="suggestion-chip" onclick="setSearchQuery('${q}')">${q}</button>`
      ).join('');
      searchSuggestions.style.display = 'flex';
    }
    
    window.setSearchQuery = function(query) {
      searchInput.value = query;
      currentQuery = query;
      searchClearBtn.style.display = 'flex';
      searchSuggestions.style.display = 'none';
      performSearch();
    };
    
    async function performSearch() {
      if (!currentQuery || currentQuery.trim().length < 2) {
        searchResults.innerHTML = '';
        searchResultsCount.textContent = '';
        searchResults.style.display = 'none';
        popularRestaurants.style.display = 'block';
        return;
      }
      
      // Скрываем популярные рестораны и показываем результаты
      popularRestaurants.style.display = 'none';
      searchResults.style.display = 'block';
      searchFilters.style.display = 'block';
      
      try {
        const params = new URLSearchParams({
          q: currentQuery
        });
        
        if (currentFilter === 'restaurants') {
          params.append('type', 'restaurants');
        } else if (currentFilter === 'dishes') {
          params.append('type', 'dishes');
        }
        
        if (currentFilter === 'promotions') {
          params.append('with_promotions', 'true');
        }
        
        const res = await fetch(api + '/public/search?' + params.toString());
        if (!res.ok) throw new Error('Search failed');
        
        const data = await res.json();
        
        if (data.total === 0) {
          searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #6b7280;">Ничего не найдено</div>';
          searchResultsCount.textContent = 'Найдено 0 результатов';
          return;
        }
        
        searchResultsCount.textContent = `Найдено ${data.total} результатов`;
        
        if (data.restaurants.length === 0) {
          searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #6b7280;">Ничего не найдено</div>';
          return;
        }
        
        searchResults.innerHTML = data.restaurants.map(restaurant => {
          const p = new URLSearchParams(location.search);
          if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
          
          let dishesHtml = '';
          if (restaurant.dishes && restaurant.dishes.length > 0) {
            dishesHtml = `
              <div class="search-dishes-scroll">
                ${restaurant.dishes.map(dish => {
                  const dishParams = new URLSearchParams(p);
                  dishParams.set('from', 'search');
                  dishParams.set('search_query', currentQuery);
                  // Сохраняем ID ресторана для возврата к позиции
                  dishParams.set('scroll_to_restaurant_id', restaurant.id.toString());
                  return `
                  <div class="search-dish-card" onclick="(function(){try{const s=window.pageYOffset||document.documentElement.scrollTop;sessionStorage.setItem('search_page_scroll',s.toString());}catch(e){}}());location.href='/static/restaurant.html?id=${restaurant.id}&dish_id=${dish.id}&${dishParams.toString()}'">
                    ${dish.image ? `<img src="${dish.image}" alt="${dish.name}" class="search-dish-image" onerror="this.style.display='none'"/>` : '<div class="search-dish-image"></div>'}
                    <div class="search-dish-info">
                      <div class="search-dish-name">${dish.name}</div>
                      <div class="search-dish-price">${dish.price} ₽</div>
                    </div>
                  </div>
                  `;
                }).join('')}
              </div>
            `;
          }
          
          const ratingText = restaurant.rating && restaurant.rating > 0 
            ? `★ ${restaurant.rating.toFixed(1)}`
            : 'Мало оценок';
          
          return `
            <div class="search-restaurant-block" data-restaurant-id="${restaurant.id}">
              <div class="search-restaurant-header" onclick="goToRestaurant(${restaurant.id})">
                ${restaurant.image ? `<img src="${restaurant.image}" alt="${restaurant.name}" class="search-restaurant-image" onerror="this.style.display='none'"/>` : '<div class="search-restaurant-image"></div>'}
                <div class="search-restaurant-info">
                  <div class="search-restaurant-name">${restaurant.name}</div>
                  <div class="search-restaurant-meta">
                    <span class="search-restaurant-rating">${ratingText}</span>
                    <span>·</span>
                    <span>${restaurant.delivery_time_minutes || '--'} мин</span>
                    ${restaurant.delivery_fee === 0 ? '<span style="color: #059669; font-weight: 600;">Бесплатная доставка</span>' : ''}
                  </div>
                </div>
              </div>
              ${dishesHtml}
            </div>
          `;
        }).join('');
        
        // После рендеринга результатов проверяем, нужно ли прокрутить к элементу
        // НО: если есть сохраненная позиция скролла, используем её вместо scrollIntoView
        const urlParams = new URLSearchParams(location.search);
        const scrollToRestaurantId = urlParams.get('scroll_to_restaurant_id');
        const hasSavedScroll = sessionStorage.getItem('search_page_scroll');
        
        if (scrollToRestaurantId && !hasSavedScroll) {
          // Только если нет сохраненной позиции, прокручиваем к элементу
          setTimeout(() => {
            const element = document.querySelector(`[data-restaurant-id="${scrollToRestaurantId}"]`);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth', block: 'center' });
              // Удаляем параметр из URL после прокрутки
              urlParams.delete('scroll_to_restaurant_id');
              const newUrl = location.pathname + '?' + urlParams.toString();
              history.replaceState({}, '', newUrl);
            }
          }, 100);
        } else if (scrollToRestaurantId && hasSavedScroll) {
          // Если есть сохраненная позиция, удаляем параметр, но не прокручиваем
          // Восстановление позиции произойдет в restoreScrollPosition()
          urlParams.delete('scroll_to_restaurant_id');
          const newUrl = location.pathname + '?' + urlParams.toString();
          history.replaceState({}, '', newUrl);
        }
        
      } catch (error) {
        console.error('Search error:', error);
        searchResults.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #dc2626;">Ошибка при поиске</div>';
      }
    }
    
    searchInput.addEventListener('input', (e) => {
      currentQuery = e.target.value;
      
      if (currentQuery.length > 0) {
        searchClearBtn.style.display = 'flex';
      } else {
        searchClearBtn.style.display = 'none';
        searchResults.style.display = 'none';
        searchResultsCount.textContent = '';
        searchFilters.style.display = 'none';
        popularRestaurants.style.display = 'block';
      }
      
      renderSuggestions();
      
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        if (currentQuery.trim().length >= 2) {
          performSearch();
        } else {
          searchResults.style.display = 'none';
          popularRestaurants.style.display = 'block';
        }
      }, 300);
    });
    
    // Закрытие клавиатуры при нажатии Enter на мобильных устройствах
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13) {
        // Закрываем клавиатуру на мобильных устройствах
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          searchInput.blur();
        }
      }
    });
    
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentQuery = '';
      searchClearBtn.style.display = 'none';
      searchResults.style.display = 'none';
      searchResultsCount.textContent = '';
      searchFilters.style.display = 'none';
      popularRestaurants.style.display = 'block';
      searchInput.focus();
    });
    
    searchBackBtn.addEventListener('click', () => {
      const p = new URLSearchParams(location.search);
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Удаляем параметры поиска при возврате на главную
      p.delete('from');
      p.delete('search_query');
      p.delete('id');
      p.delete('scroll_to_restaurant_id');
      // Сохраняем флаг для восстановления позиции скролла
      p.set('restore_scroll', '1');
      location.href = '/static/index.html?' + p.toString();
    });
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        if (currentQuery.trim().length >= 2) {
          performSearch();
        }
      });
    });
    
    // Навигация
    document.getElementById('navHome').onclick = (e) => { 
      e.preventDefault(); 
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1');
      // Удаляем параметры поиска при переходе на главную
      p.delete('from');
      p.delete('search_query');
      p.delete('id');
      p.delete('scroll_to_restaurant_id');
      // Сохраняем флаг для восстановления позиции скролла
      p.set('restore_scroll', '1');
      location.href = '/static/index.html?' + p.toString(); 
    };
    document.getElementById('navCart').onclick = (e) => { 
      e.preventDefault(); 
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      p.set('from', 'search');
      location.href = '/static/cart.html?' + p.toString(); 
    };
    document.getElementById('navProfile').onclick = (e) => { 
      e.preventDefault(); 
      const p = new URLSearchParams(location.search); 
      if (!p.get('ngrok-skip-browser-warning')) p.set('ngrok-skip-browser-warning', '1'); 
      location.href = '/static/profile.html?' + p.toString(); 
    };
    
    // Функция для восстановления позиции скролла (с защитой от iOS Safari)
    function restoreScrollPosition() {
      try {
        const savedScroll = sessionStorage.getItem('search_page_scroll');
        if (!savedScroll) return;
        
        const scrollY = parseInt(savedScroll, 10);
        if (scrollY <= 0) return;
        
        // Отключаем автоматическое восстановление скролла браузером
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        
        let scrollRestored = false;
        let attempts = 0;
        const maxAttempts = 5;
        
        // Устанавливаем флаг восстановления
        isRestoringScroll = true;
        targetScrollPosition = scrollY;
        // Устанавливаем время окончания защиты (5 секунд для iOS)
        scrollProtectionEndTime = Date.now() + 5000;
        
        // Функция для проверки и восстановления позиции
        const checkAndScroll = () => {
          attempts++;
          const pageHeight = Math.max(
            document.body.scrollHeight,
            document.body.offsetHeight,
            document.documentElement.clientHeight,
            document.documentElement.scrollHeight,
            document.documentElement.offsetHeight
          );
          
          if (pageHeight <= scrollY) {
            // Страница еще не достаточно высокая, пробуем еще раз
            if (attempts < maxAttempts) {
              setTimeout(checkAndScroll, 100);
            } else {
              console.log('Page height too small for scroll position after max attempts');
              isRestoringScroll = false;
              targetScrollPosition = 0;
              scrollProtectionEndTime = 0;
              if (scrollProtectionInterval) {
                clearInterval(scrollProtectionInterval);
                scrollProtectionInterval = null;
              }
              sessionStorage.removeItem('search_page_scroll');
            }
            return;
          }
          
          const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
          
          // Если позиция уже правильная, завершаем
          if (Math.abs(currentScroll - scrollY) <= 10) {
            if (!scrollRestored) {
              console.log('Scroll position already correct:', currentScroll);
              scrollRestored = true;
              // Не отключаем защиту сразу, даем время для стабилизации
              setTimeout(() => {
                isRestoringScroll = false;
                targetScrollPosition = 0;
                scrollProtectionEndTime = 0;
                if (scrollProtectionInterval) {
                  clearInterval(scrollProtectionInterval);
                  scrollProtectionInterval = null;
                }
              }, 1000);
              sessionStorage.removeItem('search_page_scroll');
            }
            return;
          }
          
          // Восстанавливаем позицию с использованием requestAnimationFrame для iOS
          requestAnimationFrame(() => {
            window.scrollTo({ top: scrollY, behavior: 'auto' });
            console.log(`Restored scroll position (attempt ${attempts}):`, scrollY);
          });
          
          // Проверяем через задержку, не сбросил ли браузер позицию (особенно на iOS)
          setTimeout(() => {
            const newScroll = window.pageYOffset || document.documentElement.scrollTop;
            if (Math.abs(newScroll - scrollY) > 50) {
              // Браузер сбросил позицию - восстанавливаем снова
              console.log('Browser reset scroll position, fixing:', newScroll, '->', scrollY);
              window.scrollTo({ top: scrollY, behavior: 'auto' });
              
              // Еще одна проверка через больший интервал для iOS
              setTimeout(() => {
                const finalScroll = window.pageYOffset || document.documentElement.scrollTop;
                if (Math.abs(finalScroll - scrollY) > 50) {
                  window.scrollTo({ top: scrollY, behavior: 'auto' });
                  console.log('Second fix for iOS scroll reset');
                }
                scrollRestored = true;
                // Отключаем защиту через небольшую задержку после успешного восстановления
                setTimeout(() => {
                  isRestoringScroll = false;
                  targetScrollPosition = 0;
                  scrollProtectionEndTime = 0;
                  if (scrollProtectionInterval) {
                    clearInterval(scrollProtectionInterval);
                    scrollProtectionInterval = null;
                  }
                }, 2000);
                sessionStorage.removeItem('search_page_scroll');
              }, 200);
            } else {
              scrollRestored = true;
              // Отключаем защиту через небольшую задержку после успешного восстановления
              setTimeout(() => {
                isRestoringScroll = false;
                targetScrollPosition = 0;
                scrollProtectionEndTime = 0;
                if (scrollProtectionInterval) {
                  clearInterval(scrollProtectionInterval);
                  scrollProtectionInterval = null;
                }
              }, 2000);
              sessionStorage.removeItem('search_page_scroll');
            }
          }, 100);
        };
        
        // Начинаем восстановление после небольшой задержки для завершения рендеринга
        setTimeout(checkAndScroll, 100);
        
        // Дополнительная проверка через больший интервал для iOS
        setTimeout(() => {
          if (!scrollRestored && attempts < maxAttempts) {
            checkAndScroll();
          }
        }, 500);
        
        // Автоматически отключаем защиту через 5 секунд (на случай, если что-то пошло не так)
        setTimeout(() => {
          if (isRestoringScroll) {
            console.log('Auto-disabling scroll protection after timeout');
            isRestoringScroll = false;
            targetScrollPosition = 0;
            scrollProtectionEndTime = 0;
            if (scrollProtectionInterval) {
              clearInterval(scrollProtectionInterval);
              scrollProtectionInterval = null;
            }
          }
        }, 5000);
        
      } catch (e) {
        console.log('Could not restore scroll position:', e);
        isRestoringScroll = false;
        targetScrollPosition = 0;
        scrollProtectionEndTime = 0;
        if (scrollProtectionInterval) {
          clearInterval(scrollProtectionInterval);
          scrollProtectionInterval = null;
        }
        sessionStorage.removeItem('search_page_scroll');
      }
    }
    
    // Обработчик для отслеживания нежелательного сброса позиции на iOS
    function setupScrollProtection() {
      // Обработчик события scroll
      window.addEventListener('scroll', () => {
        if (isRestoringScroll && targetScrollPosition > 0) {
          const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
          // Если браузер сбросил позицию во время восстановления, исправляем
          if (Math.abs(currentScroll - targetScrollPosition) > 100 && currentScroll < 50) {
            // Браузер сбросил позицию вверх - восстанавливаем
            clearTimeout(scrollRestoreTimeout);
            scrollRestoreTimeout = setTimeout(() => {
              requestAnimationFrame(() => {
                window.scrollTo({ top: targetScrollPosition, behavior: 'auto' });
                console.log('Protected scroll position from browser reset on iOS (scroll event)');
              });
            }, 50);
          }
        }
      }, { passive: true });
      
      // Агрессивный мониторинг через интервал (для iOS)
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        scrollProtectionInterval = setInterval(() => {
          if (isRestoringScroll && targetScrollPosition > 0 && Date.now() < scrollProtectionEndTime) {
            const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
            // Если позиция сильно отличается от целевой и близка к верху, исправляем
            if (Math.abs(currentScroll - targetScrollPosition) > 100 && currentScroll < 100) {
              requestAnimationFrame(() => {
                window.scrollTo({ top: targetScrollPosition, behavior: 'auto' });
                console.log('Protected scroll position from browser reset on iOS (interval check)');
              });
            }
          } else if (Date.now() >= scrollProtectionEndTime) {
            // Время защиты истекло
            clearInterval(scrollProtectionInterval);
            scrollProtectionInterval = null;
            isRestoringScroll = false;
            targetScrollPosition = 0;
          }
        }, 100); // Проверяем каждые 100ms
      }
      
      // Обработчик pageshow для iOS (когда страница восстанавливается из кэша)
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          // Страница восстановлена из кэша, проверяем сохраненную позицию
          try {
            const savedScroll = sessionStorage.getItem('search_page_scroll');
            if (savedScroll) {
              const scrollY = parseInt(savedScroll, 10);
              if (scrollY > 0) {
                targetScrollPosition = scrollY;
                isRestoringScroll = true;
                scrollProtectionEndTime = Date.now() + 5000;
                requestAnimationFrame(() => {
                  setTimeout(() => {
                    window.scrollTo({ top: scrollY, behavior: 'auto' });
                    console.log('Restored scroll position after pageshow event on iOS');
                  }, 100);
                });
              }
            }
          } catch (e) {
            console.log('Could not restore scroll after pageshow:', e);
          }
        }
      });
    }
    
    // Инициализация - загружаем данные и фокусируемся после загрузки
    async function initialize() {
      // Настраиваем защиту от сброса скролла
      setupScrollProtection();
      
      // Проверяем, есть ли сохраненная позиция скролла - восстанавливаем её сразу
      // Это важно для iOS, чтобы предотвратить сброс позиции браузером
      try {
        const savedScroll = sessionStorage.getItem('search_page_scroll');
        if (savedScroll) {
          const scrollY = parseInt(savedScroll, 10);
          if (scrollY > 0) {
            // Устанавливаем флаги защиты сразу
            isRestoringScroll = true;
            targetScrollPosition = scrollY;
            scrollProtectionEndTime = Date.now() + 5000;
            
            // Пытаемся восстановить позицию сразу (даже если контент еще не загружен)
            // Это поможет предотвратить сброс позиции браузером
            requestAnimationFrame(() => {
              window.scrollTo({ top: scrollY, behavior: 'auto' });
            });
          }
        }
      } catch (e) {
        console.log('Could not pre-restore scroll position:', e);
      }
      
      // Проверяем, есть ли сохраненный поисковый запрос в URL
      const urlParams = new URLSearchParams(location.search);
      const savedQuery = urlParams.get('search_query');
      
      if (savedQuery) {
        // Восстанавливаем поисковый запрос
        searchInput.value = savedQuery;
        currentQuery = savedQuery;
        
        // Показываем кнопку очистки
        if (savedQuery.length > 0) {
          searchClearBtn.style.display = 'flex';
        }
        
        // Выполняем поиск
        await performSearch();
        
        // Восстанавливаем позицию скролла после загрузки результатов
        // Используем requestAnimationFrame для более плавного восстановления
        requestAnimationFrame(() => {
          setTimeout(() => {
            restoreScrollPosition();
          }, 200);
        });
        
        // Фокусируемся на поле поиска
        requestAnimationFrame(() => {
          try {
            searchInput.focus();
          } catch (e) {
            console.log('Focus blocked by browser security policy (cross-origin), user can click manually');
          }
        });
      } else {
        // Обычная инициализация без поискового запроса
        // Показываем UI сразу (пока данные загружаются)
        popularRestaurants.style.display = 'block';
        
        // Параллельно загружаем популярные рестораны и фокусируемся на поле
        const loadPromise = loadPopularRestaurants();
        
        // Фокусируемся сразу (не ждем загрузки данных)
        requestAnimationFrame(() => {
          try {
            searchInput.focus();
          } catch (e) {
            // Браузер может блокировать autofocus в iframe - это нормально
            console.log('Focus blocked by browser security policy (cross-origin), user can click manually');
          }
        });
        
        // Ждем загрузки данных
        await loadPromise;
      }
    }
    
    // Запускаем инициализацию после загрузки DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialize);
    } else {
      initialize();
    }
  </script>
